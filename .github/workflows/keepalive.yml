name: Keep Alive
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name keepalive-bot
          git config user.email bot@users.noreply.github.com
          git add .keepalive
          git commit -m "keep scheduled jobs active" || true
          git push
